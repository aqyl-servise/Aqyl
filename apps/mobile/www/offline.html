<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aqyl</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 28px;
      background: #0f0d2a; color: #f2f0ff;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      text-align: center; line-height: 1.6;
    }
    .brand { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 22px; }
    .brand b { color: #f0a52e; }
    h1 { font-size: 21px; font-weight: 700; margin-bottom: 10px; }
    p { color: #9a93c9; font-size: 15px; max-width: 30ch; margin: 0 auto 22px; }
    button {
      background: #f0a52e; color: #2a1c02; border: 0; border-radius: 11px;
      padding: 13px 26px; font: inherit; font-weight: 800; cursor: pointer;
    }
    button:active { opacity: .85; }
  </style>
</head>
<body>
  <div>
    <div class="brand">aqy<b>l</b></div>
    <h1>Нет подключения к интернету</h1>
    <p>Проверьте связь и попробуйте снова — материалы создаются на сервере.</p>
    <button onclick="location.reload()">Повторить</button>
  </div>
</body>
</html>
